<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: Arial, sans-serif;
      background: #fdf8f0;
      color: #222;
    }

    .header {
      background: #6B0F1A;
      padding: 16px 18px 14px;
      border-bottom: 3px solid #C9A84C;
    }

    .header h1 {
      font-size: 15px;
      color: #C9A84C;
      font-weight: bold;
      letter-spacing: 0.3px;
    }

    .header p {
      font-size: 11px;
      color: #c9a0a8;
      margin-top: 2px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .body {
      padding: 16px 18px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .status-label {
      font-size: 12px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .badge {
      font-size: 11px;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    .badge.active {
      background: #d4edda;
      color: #155724;
    }

    .badge.inactive {
      background: #f8d7da;
      color: #721c24;
    }

    .current-tag {
      background: #f0e8d8;
      border: 1px solid #d8c8a8;
      border-radius: 5px;
      padding: 10px 12px;
      margin-bottom: 14px;
    }

    .current-tag .tag-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #888;
      margin-bottom: 3px;
    }

    .current-tag .tag-value {
      font-size: 14px;
      font-weight: bold;
      color: #6B0F1A;
      font-family: monospace;
    }

    .current-tag .tag-value.empty {
      color: #aaa;
      font-style: italic;
      font-family: Arial, sans-serif;
      font-weight: normal;
      font-size: 13px;
    }

    .divider {
      border: none;
      border-top: 1px solid #e8ddd0;
      margin: 14px 0;
    }

    .input-label {
      font-size: 11px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      padding: 9px 11px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
      margin-bottom: 8px;
      font-family: monospace;
    }

    input[type="text"]:focus {
      border-color: #6B0F1A;
    }

    .error {
      font-size: 11px;
      color: #c0392b;
      margin-bottom: 8px;
      display: none;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    .btn-primary {
      flex: 1;
      padding: 9px;
      background: #6B0F1A;
      color: #C9A84C;
      font-size: 12px;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 0.5px;
    }

    .btn-primary:hover { background: #8c1422; }
    .btn-primary:disabled { background: #ccc; color: #888; cursor: default; }

    .btn-secondary {
      padding: 9px 12px;
      background: transparent;
      color: #999;
      font-size: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-secondary:hover { border-color: #c0392b; color: #c0392b; }
    .btn-secondary:disabled { opacity: 0.4; cursor: default; pointer-events: none; }

    .footer {
      padding: 10px 18px;
      border-top: 1px solid #e8ddd0;
      font-size: 10px;
      color: #bbb;
      text-align: center;
    }

    .company-mode-note {
      font-size: 12px;
      color: #555;
      background: #f0e8d8;
      border-radius: 4px;
      padding: 10px 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="ext-name">Amazon Referral Tag</h1>
    <p>Associates Tag Manager</p>
  </div>

  <div class="body">
    <div class="status-row">
      <span class="status-label">Status</span>
      <span class="badge inactive" id="status-badge">Inactive</span>
    </div>

    <div class="current-tag">
      <div class="tag-label">Current Tag</div>
      <div class="tag-value empty" id="current-tag-value">Not set</div>
    </div>

    <div id="demo-controls">
      <hr class="divider">
      <div class="input-label">Set Referral Tag</div>
      <input type="text" id="tag-input" placeholder="e.g. yourname-20" autocomplete="off" spellcheck="false">
      <div class="error" id="tag-error">Please enter a valid tag (e.g. yourname-20)</div>
      <div class="btn-row">
        <button class="btn-primary" id="save-btn">Apply Tag</button>
        <button class="btn-secondary" id="clear-btn" disabled>Remove</button>
      </div>
    </div>

    <div id="company-controls" style="display:none">
      <p class="company-mode-note">Tag is configured for this deployment. No changes needed.</p>
    </div>
  </div>

  <div class="footer">
    Every Amazon visit will include your tag automatically.
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
